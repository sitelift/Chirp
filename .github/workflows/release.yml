name: Release Windows
on:
  push:
    tags: ['v2.*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing v2.x.y tag to build'
        required: true
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    env:
      CARGO_TARGET_DIR: C:/tmp/chirp-target
      LIBCLANG_PATH: C:/Program Files/LLVM/bin
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Prepare version and CPU native libraries
        shell: pwsh
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          if ($env:RELEASE_TAG -notmatch '^v2\.\d+\.\d+$') { throw 'Only stable v2.x.y tags use this feed' }
          $version = $env:RELEASE_TAG.Substring(1)
          node scripts/set-version.cjs $version
          $name = 'sherpa-onnx-v1.12.36-win-x64-shared-MT-Release'
          curl.exe -fL "https://github.com/k2-fsa/sherpa-onnx/releases/download/v1.12.36/$name.tar.bz2" -o cpu.tar.bz2
          if ($LASTEXITCODE) { throw 'CPU runtime download failed' }
          if ((Get-FileHash cpu.tar.bz2 -Algorithm SHA256).Hash.ToLowerInvariant() -ne '0c027b0729f28e229082ff53d4a1cc8f6636e736ef4cefe05069d75a613cfc58') { throw 'CPU runtime checksum mismatch' }
          tar -xjf cpu.tar.bz2
          if ($LASTEXITCODE) { throw 'CPU runtime extraction failed' }
          New-Item -ItemType Directory -Force src-tauri/sherpa-onnx-lib | Out-Null
          Copy-Item "$name/lib/*.dll" src-tauri/
          Copy-Item "$env:VCToolsRedistDir/x64/Microsoft.VC143.CRT/*.dll" src-tauri/sherpa-onnx-lib/
          Copy-Item "$name/lib/*.lib" src-tauri/sherpa-onnx-lib/
          Copy-Item "$name/lib/*.dll" src-tauri/
          lib /DEF:src-tauri/sherpa-onnx-lib/onnxruntime.def /OUT:src-tauri/sherpa-onnx-lib/onnxruntime.lib /MACHINE:X64
          if ($LASTEXITCODE) { throw 'Import library generation failed' }
          "C:/Program Files/CMake/bin" >> $env:GITHUB_PATH
          "C:/Program Files/LLVM/bin" >> $env:GITHUB_PATH
      - run: npm ci
      - run: cargo test --manifest-path src-tauri/Cargo.toml
      - run: cargo test --manifest-path src-tauri/Cargo.toml --features bench --bin bench
      - run: npm run lint
      - run: cargo install trusted-signing-cli --locked
      - name: Build and sign
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
        shell: pwsh
        run: |
          if (!$env:TAURI_SIGNING_PRIVATE_KEY) { throw 'Missing updater signing key' }
          npx tauri build --bundles nsis --config src-tauri/tauri.release.conf.json
          if ($LASTEXITCODE) { throw 'Build failed' }
          $installer = (Get-ChildItem "$env:CARGO_TARGET_DIR/release/bundle/nsis/*-setup.exe").FullName
          trusted-signing-cli -e https://eus.codesigning.azure.net -a chirp -c chirp-codesigning -d Chirp $installer
          if ($LASTEXITCODE) { throw 'Installer code signing failed' }
          # Authenticode changes the bytes: updater-sign the FINAL installer.
          npx tauri signer sign $installer
          if ($LASTEXITCODE) { throw 'Updater signature failed' }
      - name: Create draft with Windows updater manifest
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          $installer = Get-ChildItem "$env:CARGO_TARGET_DIR/release/bundle/nsis/*-setup.exe"
          $version = $env:RELEASE_TAG.Substring(1)
          $manifest = @{
            version = $version
            notes = "See https://github.com/${{ github.repository }}/releases/tag/$env:RELEASE_TAG"
            pub_date = [DateTime]::UtcNow.ToString('yyyy-MM-ddTHH:mm:ssZ')
            platforms = @{ 'windows-x86_64' = @{
              signature = (Get-Content "$($installer.FullName).sig" -Raw).Trim()
              url = "https://github.com/${{ github.repository }}/releases/download/$env:RELEASE_TAG/$($installer.Name)"
            } }
          }
          $manifest | ConvertTo-Json -Depth 5 | Set-Content -Encoding utf8 latest.json
          gh release view $env:RELEASE_TAG *> $null
          if ($LASTEXITCODE) { gh release create $env:RELEASE_TAG --draft --title "Chirp $env:RELEASE_TAG" --generate-notes }
          gh release upload $env:RELEASE_TAG $installer.FullName "$($installer.FullName).sig" latest.json --clobber
          if ($LASTEXITCODE) { throw 'Release upload failed' }
          # Publish manually after the clean-machine and signed-update checks.
